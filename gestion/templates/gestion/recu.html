<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reçu | Arielle Boutique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-screen: #f1f5f9;
            --wallet-bg: #ffffff;
            --text-dark: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --primary-accent: #dc2626; /* Rouge Professionnel */
            --secondary-accent: #eab308; /* Jaune Or Boutique */
            --border: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-screen);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* Conteneur style Portefeuille haut de gamme */
        .wallet-card {
            background: var(--wallet-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 32px;
            position: relative;
        }

        /* Décoration de découpe style ticket de caisse en bas du reçu interne */
        .receipt-inner {
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 28px;
            margin-bottom: 28px;
        }

        /* Header avec logo panier + parfum en rouge et jaune */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            margin-bottom: 12px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .receipt-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Lignes de données */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f8fafc;
        }

        .info-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .info-value {
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 600;
            text-align: right;
        }

        /* Section Total Payé */
        .total-highlight-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fffbeb; /* Fond chaud très subtil */
            border: 1px solid #fef3c7;
            padding: 16px 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .total-label {
            font-size: 15px;
            font-weight: 600;
            color: #b45309;
        }

        .total-amount {
            font-size: 22px;
            font-weight: 700;
            color: #b45309;
        }

        /* Actions alignées à droite en bas du portefeuille */
        .wallet-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .btn-action-primary {
            background: var(--text-dark);
            color: #ffffff;
            border: none;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action-primary:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }

        .btn-action-secondary {
            background: #f1f5f9;
            color: var(--text-secondary);
            border: none;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-action-secondary:hover {
            background: #e2e8f0;
            color: var(--text-dark);
            transform: translateY(-1px);
        }

        /* STYLE PROPRE POUR L'IMPRESSION SUR PAPIER */
        @media print {
            body {
                background: #ffffff;
                padding: 0;
                display: block;
            }
            .wallet-card {
                box-shadow: none;
                border: none;
                padding: 0;
                max-width: 100%;
            }
            .receipt-inner {
                border-bottom: none;
            }
            .total-highlight-row {
                background: #ffffff;
                border: 1px solid #000000;
                color: #000000;
            }
            .total-label, .total-amount {
                color: #000000;
            }
            .wallet-actions {
                display: none !important; /* Cache les boutons à l'impression */
            }
        }
    </style>
</head>
<body>

    <div class="wallet-card">
        <div class="receipt-inner">
            
            <div class="brand-header">
                <svg class="brand-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 24H52L46 52H18L12 24Z" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
                    <path d="M22 24V52M32 24V52M42 24V52" stroke="#dc2626" stroke-width="2"/>
                    <rect x="20" y="10" width="10" height="14" rx="2" fill="#eab308"/>
                    <rect x="23" y="6" width="4" height="4" fill="#dc2626"/>
                    <path d="M36 8H44V24H36V8Z" fill="#dc2626"/>
                    <circle cx="40" cy="14" r="2" fill="#eab308"/>
                    <path d="M16 24C16 14 23.1634 8 32 8C40.8366 8 48 14 48 24" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
                </svg>
                
                <div class="brand-name">Arielle Boutique</div>
                <div class="receipt-title">Reçu Officiel</div>
            </div>

            <div style="font-size: 11px; color: #64748b; margin-top: 10px; line-height: 1.6;">
    <p>TVA : FR-88-123456789</p>
    <p>Boutique Numéro : 001-BOU</p>
    <p>Adresse : 122 avenue de la liberation , Kinshasa</p>
</div>

            <div class="info-row">
                <span class="info-label">Date & Heure</span>
                <span class="info-value">{{ vente.date_vente|date:"d/m/Y H:i" }}</span>
            </div>

            <div class="info-row">
                <span class="info-label">Article acheté</span>
                <span class="info-value">{{ vente.article.nom }}</span>
            </div>

            <div class="total-highlight-row">
                <span class="total-label">Total Payé</span>
                <span class="total-amount">{{ vente.total }} $</span>
            </div>

        </div>

        <div class="wallet-actions">
            <a href="{% url 'liste_articles' %}" class="btn-action-secondary">Inventaire</a>
            <button class="btn-action-primary" onclick="window.print()">Imprimer le reçu</button>
        </div>
    </div>

</body>
</html>
